<app-navbar></app-navbar>

<main class="app-main-layout">
  <router-outlet></router-outlet>
</main>

<!-- Initial Server Connection Loading Overlay -->
<div class="server-loading-overlay" *ngIf="isLoading$ | async">
  <div class="server-loading-card">
    <div class="server-loading-spinner-wrap">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <div class="server-loading-pulse"></div>
    </div>

    <h5 class="server-loading-title">Connecting to Server</h5>
    <p class="server-loading-subtitle">
      Waking up backend service on Render. Please wait a few moments...
    </p>
  </div>
</div>

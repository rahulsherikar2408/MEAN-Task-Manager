<div class="container mt-4">

  <div class="card">

    <div class="card-body">

      <h4>Add Task</h4>

      <form #taskForm="ngForm" (ngSubmit)="addTask()">

        <!-- Title -->
        <div class="mb-3">

          <label class="form-label">
            Task Title
          </label>

          <input
            type="text"
            class="form-control"
            placeholder="Enter task"
            name="title"
            [(ngModel)]="title"
            #taskTitle="ngModel"
            required
            minlength="3"
            maxlength="100"
          >

          <div
            class="text-danger mt-1"
            *ngIf="
              taskTitle.invalid &&
              (taskTitle.dirty || taskTitle.touched)
            "
          >

            <small *ngIf="taskTitle.errors?.['required']">
              Title is required.
            </small>

            <small *ngIf="taskTitle.errors?.['minlength']">
              Title must be at least 3 characters.
            </small>

          </div>

        </div>


        <!-- Description -->
        <div class="mb-3">

          <label class="form-label">
            Description
          </label>

          <textarea
            class="form-control"
            rows="3"
            placeholder="Enter task description"
            name="description"
            [(ngModel)]="description"
          ></textarea>

        </div>


        <div class="row">

          <!-- Priority -->
          <div class="col-md-4 mb-3">

            <label class="form-label">
              Priority
            </label>

            <select
              class="form-select"
              name="priority"
              [(ngModel)]="priority"
            >

              <option value="URGENT">🔴 Urgent</option>
              <option value="HIGH">🟠 High</option>
              <option value="MEDIUM">🟡 Medium</option>
              <option value="LOW">🟢 Low</option>

            </select>

          </div>


          <!-- Category -->
          <div class="col-md-4 mb-3">

            <label class="form-label">
              Category
            </label>

            <select
              class="form-select"
              name="category"
              [(ngModel)]="category"
            >

              <option value="Other">Other</option>
              <option value="Work">Work</option>
              <option value="Study">Study</option>
              <option value="Personal">Personal</option>
              <option value="Project">Project</option>

            </select>

          </div>


          <!-- Due Date -->
          <div class="col-md-4 mb-3">

            <label class="form-label">
              Due Date
            </label>

            <input
              type="date"
              class="form-control"
              name="dueDate"
              [(ngModel)]="dueDate"
              #taskDate="ngModel"
              required
            >

            <div
              class="text-danger mt-1"
              *ngIf="
                taskDate.invalid &&
                (taskDate.dirty || taskDate.touched)
              "
            >

              <small>
                Due Date is required.
              </small>

            </div>

          </div>

        </div>


        <!-- Tags -->
        <div class="mb-3">

          <label class="form-label">
            Tags
          </label>

          <input
            type="text"
            class="form-control"
            placeholder="Angular, Project, Urgent"
            name="tags"
            [(ngModel)]="tags"
          >

          <small class="text-muted">
            Separate multiple tags using commas.
          </small>

        </div>


        <button
          type="submit"
          class="btn btn-success"
          [disabled]="taskForm.invalid"
        >
          Add Task
        </button>

      </form>

    </div>

  </div>

</div>

<div class="container mt-4 mb-5">
  <!-- ========================= -->
  <!-- Page Heading -->
  <!-- ========================= -->

  <div
    class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center mb-4 gap-2"
  >
    <div>
      <h4 class="mb-1">
        Add New Task
      </h4>

      <p class="text-muted mb-0">
        Create a new task and keep track of your work.
      </p>
    </div>
  </div>

  <!-- ========================= -->
  <!-- Add Task Card -->
  <!-- ========================= -->

  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <form #taskForm="ngForm" (ngSubmit)="addTask()">
        <!-- ========================= -->
        <!-- Title -->
        <!-- ========================= -->

        <div class="mb-3">
          <label for="title" class="form-label fw-semibold">
            Task Title

            <span class="text-danger"> * </span>
          </label>

          <input
            id="title"
            type="text"
            class="form-control"
            name="title"
            [(ngModel)]="task.title"
            #title="ngModel"
            required
            minlength="3"
            maxlength="100"
            placeholder="Enter task title"
          />

          <!-- Validation -->

          <div
            *ngIf="title.invalid && (title.touched || title.dirty)"
            class="text-danger small mt-1"
          >
            <div *ngIf="title.errors?.['required']">
              Task title is required.
            </div>

            <div *ngIf="title.errors?.['minlength']">
              Title must contain at least 3 characters.
            </div>

            <div *ngIf="title.errors?.['maxlength']">
              Title cannot exceed 100 characters.
            </div>
          </div>

          <!-- Character Count -->

          <small class="text-muted"> {{ task.title.length }}/100 </small>
        </div>

        <!-- ========================= -->
        <!-- Description -->
        <!-- ========================= -->

        <div class="mb-3">
          <label for="description" class="form-label fw-semibold">
            Description
          </label>

          <textarea
            id="description"
            class="form-control"
            name="description"
            rows="5"
            [(ngModel)]="task.description"
            maxlength="1000"
            placeholder="Describe the task..."
          ></textarea>

          <small class="text-muted"> {{ task.description.length }}/1000 </small>
        </div>

        <!-- ========================= -->
        <!-- Status + Priority -->
        <!-- ========================= -->

        <div class="row g-3">
          <!-- Status -->

          <div class="col-12 col-md-6">
            <label for="status" class="form-label fw-semibold"> Status </label>

            <select
              id="status"
              class="form-select"
              name="status"
              [(ngModel)]="task.status"
            >
              <option value="TODO">To Do</option>

              <option value="IN_PROGRESS">In Progress</option>

              <option value="COMPLETED">Completed</option>
            </select>
          </div>

          <!-- Priority -->

          <div class="col-12 col-md-6">
            <label for="priority" class="form-label fw-semibold">
              Priority
            </label>

            <select
              id="priority"
              class="form-select"
              name="priority"
              [(ngModel)]="task.priority"
            >
              <option value="LOW">Low</option>

              <option value="MEDIUM">Medium</option>

              <option value="HIGH">High</option>

              <option value="URGENT">Urgent</option>
            </select>
          </div>
        </div>

        <!-- ========================= -->
        <!-- Category + Due Date -->
        <!-- ========================= -->

        <div class="row g-3 mt-1">
          <!-- Category -->

          <div class="col-12 col-md-6">
            <label for="category" class="form-label fw-semibold">
              Category
            </label>

            <select
              id="category"
              class="form-select"
              name="category"
              [(ngModel)]="task.category"
            >
              <option *ngFor="let category of categories" [value]="category">
                {{ category }}
              </option>
            </select>
          </div>

          <!-- Due Date -->

          <div class="col-12 col-md-6">
            <label for="dueDate" class="form-label fw-semibold">
              Due Date
            </label>

            <input
              id="dueDate"
              type="date"
              class="form-control"
              name="dueDate"
              [(ngModel)]="task.dueDate"
            />
          </div>
        </div>

        <!-- ========================= -->
        <!-- Tags -->
        <!-- ========================= -->

        <div class="mt-3 mb-4">
          <label for="tags" class="form-label fw-semibold"> Tags </label>

          <input
            id="tags"
            type="text"
            class="form-control"
            name="tags"
            [(ngModel)]="tagsInput"
            placeholder="Angular, Project, Urgent"
          />

          <small class="text-muted">
            Enter multiple tags separated by commas.
          </small>
        </div>

        <!-- ========================= -->
        <!-- Buttons -->
        <!-- ========================= -->

        <div class="d-flex flex-column flex-sm-row justify-content-end gap-2">
          <!-- Cancel -->

          <button
            type="button"
            class="btn btn-outline-secondary"
            (click)="cancel()"
            [disabled]="loading"
          >
            <i class="fa-solid fa-xmark me-1"></i>

            Cancel
          </button>

          <!-- Create -->

          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="loading || taskForm.invalid"
          >
            <!-- Spinner -->

            <span
              *ngIf="loading"
              class="spinner-border spinner-border-sm me-2"
              role="status"
            ></span>

            <i *ngIf="!loading" class="fa-solid fa-plus me-1"></i>

            {{ loading ? "Creating..." : "Create Task" }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

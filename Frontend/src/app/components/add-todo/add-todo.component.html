<div class="container mt-4">
    <div class="card">
    <div class="card-body">
        <h4>Add Todo</h4>

        <form #todoForm="ngForm" (ngSubmit)="addTodo()">

            <!-- Title -->
            <div class="mb-3">
                <input
                    type="text"
                    class="form-control"
                    placeholder="Enter Todo"
                    name="title"
                    [(ngModel)]="title"
                    #todoTitle="ngModel"
                    required
                    minlength="3"
                >
                <div
                    class="text-danger mt-1"
                    *ngIf="todoTitle.invalid && (todoTitle.dirty || todoTitle.touched)">
                    <small *ngIf="todoTitle.errors?.['required']">
                        Title is required.
                    </small>
                    <small *ngIf="todoTitle.errors?.['minlength']">
                        Title must be at least 3 characters.
                    </small>
                </div>
            </div>
            <div class="row">

                <!-- Priority -->
                <div class="col-md-6 mb-3">
                    <Label>Priority: </Label>
                    <select
                        class="form-select"
                        name="priority"
                        [(ngModel)]="priority">
                        <option value="High">🔴 High</option>
                        <option value="Medium">🟡 Medium</option>
                        <option value="Low">🟢 Low</option>
                    </select>
                </div>

                <!-- Due Date -->
                <div class="col-md-6 mb-3">
                    <label for="dueDate">Due Date:</label>
                    <input
                        type="date"
                        class="form-control"
                        name="dueDate"
                        [(ngModel)]="dueDate"
                        #todoDate="ngModel"
                        required
                    >
                    <div
                        class="text-danger mt-1"
                        *ngIf="todoDate.invalid && (todoDate.dirty || todoDate.touched)">
                        <small>
                            Due Date is required.
                        </small>
                    </div>
                    
                </div>
            </div>

            <button
                type="submit"
                class="btn btn-success"
                [disabled]="todoForm.invalid"
            >
                Add Todo
            </button>
        </form>
    </div>
</div>
</div>

<div class="container mt-4">
  <!-- ========================= -->
  <!-- Page Heading -->
  <!-- ========================= -->

  <div
    class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center mb-3 gap-2"
  >
    <h4 class="mb-0">
      <i class="fa-solid fa-list-check me-2"></i>

      My Tasks
    </h4>

    <div class="d-flex gap-2">
      <a routerLink="/kanban" class="btn btn-secondary">
        <i class="fa-solid fa-table-columns me-1"></i>

        Kanban
      </a>

      <a routerLink="/task/new" class="btn btn-primary">
        <i class="fa-solid fa-plus me-1"></i>

        Add Task
      </a>
    </div>
  </div>

  <div class="card mb-3">
    <div class="card-body">
      <!-- ========================= -->
      <!-- Advanced Search & Filters -->
      <!-- ========================= -->

      <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
          <!-- Filter Header -->

          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0">
              <i class="fa-solid fa-filter me-2"></i>

              Search & Filters
            </h5>

            <button
              type="button"
              class="btn btn-sm btn-outline-secondary"
              (click)="resetFilters()"
            >
              <i class="fa-solid fa-rotate-left me-1"></i>

              Reset
            </button>
          </div>

          <!-- ========================= -->
          <!-- Search -->
          <!-- ========================= -->

          <div class="mb-3">
            <label class="form-label"> Search </label>

            <div class="input-group">
              <span class="input-group-text">
                <i class="fa-solid fa-search"></i>
              </span>

              <input
                type="text"
                class="form-control"
                placeholder="Search title, description or tags..."
                [(ngModel)]="searchText"
                (ngModelChange)="onSearchChange()"
              />
            </div>

            <small class="text-muted">
              Search by task title, description or tags.
            </small>
          </div>

          <!-- ========================= -->
          <!-- Filters -->
          <!-- ========================= -->

          <div class="row g-3">
            <!-- Status -->

            <div class="col-12 col-md-6 col-lg-3">
              <label class="form-label"> Status </label>

              <select
                class="form-select"
                [(ngModel)]="statusFilter"
                (change)="applyFilters()"
              >
                <option value="All">All Statuses</option>

                <option value="TODO">To Do</option>

                <option value="IN_PROGRESS">In Progress</option>

                <option value="COMPLETED">Completed</option>
              </select>
            </div>

            <!-- Priority -->

            <div class="col-12 col-md-6 col-lg-3">
              <label class="form-label"> Priority </label>

              <select
                class="form-select"
                [(ngModel)]="priorityFilter"
                (change)="applyFilters()"
              >
                <option value="All">All Priorities</option>

                <option value="URGENT">Urgent</option>

                <option value="HIGH">High</option>

                <option value="MEDIUM">Medium</option>

                <option value="LOW">Low</option>
              </select>
            </div>

            <!-- Category -->

            <div class="col-12 col-md-6 col-lg-3">
              <label class="form-label"> Category </label>

              <select
                class="form-select"
                [(ngModel)]="categoryFilter"
                (change)="applyFilters()"
              >
                <option value="All">All Categories</option>

                <option *ngFor="let category of categories" [value]="category">
                  {{ category }}
                </option>
              </select>
            </div>

            <!-- Sort By -->

            <div class="col-12 col-md-6 col-lg-3">
              <label class="form-label"> Sort By </label>

              <select
                class="form-select"
                [(ngModel)]="sortBy"
                (change)="changeSort()"
              >
                <option value="createdAt">Created Date</option>

                <option value="updatedAt">Recently Updated</option>

                <option value="dueDate">Due Date</option>

                <option value="title">Title</option>

                <option value="priority">Priority</option>

                <option value="status">Status</option>
              </select>
            </div>

            <!-- Due From -->

            <div class="col-12 col-md-6">
              <label class="form-label"> Due From </label>

              <input
                type="date"
                class="form-control"
                [(ngModel)]="dueFrom"
                (change)="applyFilters()"
              />
            </div>

            <!-- Due To -->

            <div class="col-12 col-md-6">
              <label class="form-label"> Due To </label>

              <input
                type="date"
                class="form-control"
                [(ngModel)]="dueTo"
                (change)="applyFilters()"
              />
            </div>

            <!-- Sort Order -->

            <div class="col-12 col-md-6">
              <label class="form-label"> Sort Order </label>

              <select
                class="form-select"
                [(ngModel)]="sortOrder"
                (change)="changeSort()"
              >
                <option value="desc">Descending</option>

                <option value="asc">Ascending</option>
              </select>
            </div>

            <!-- Overdue -->

            <div class="col-12 col-md-6 d-flex align-items-end">
              <div class="form-check mb-2">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="overdueOnly"
                  [(ngModel)]="overdueOnly"
                  (change)="applyFilters()"
                />

                <label class="form-check-label" for="overdueOnly">
                  Show overdue tasks only
                </label>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ========================= -->
      <!-- Loading -->
      <!-- ========================= -->

      <div *ngIf="loading" class="text-center py-4">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden"> Loading... </span>
        </div>

        <p class="text-muted mt-2 mb-0">Loading tasks...</p>
      </div>

      <!-- ========================= -->
      <!-- Task Count -->
      <!-- ========================= -->

      <div
        *ngIf="!loading && totalTasks > 0"
        class="d-flex justify-content-between align-items-center mb-3"
      >
        <span class="text-muted">
          <i class="fa-solid fa-list me-1"></i>

          Showing

          {{ tasks.length }}

          of

          {{ totalTasks }}

          tasks
        </span>
      </div>

      <!-- ========================= -->
      <!-- My Tasks -->
      <!-- ========================= -->

      <div *ngIf="!loading && tasks.length > 0">
        <div *ngFor="let task of tasks" class="mb-3">
          <app-task-item [task]="task"></app-task-item>
        </div>
      </div>

      <!-- ========================= -->
      <!-- No Tasks -->
      <!-- ========================= -->

      <div *ngIf="!loading && tasks.length === 0" class="text-center py-4">
        <i class="fa-regular fa-circle-xmark fa-2x text-secondary mb-3"></i>

        <h5 class="text-secondary">No tasks found.</h5>

        <p class="text-muted mb-3">
          No tasks match your current search or filter criteria.
        </p>

        <button
          type="button"
          class="btn btn-outline-secondary btn-sm"
          (click)="resetFilters()"
        >
          <i class="fa-solid fa-rotate-left me-1"></i>

          Reset Filters
        </button>
      </div>

      <!-- ========================= -->
      <!-- Pagination -->
      <!-- ========================= -->

      <div
        *ngIf="!loading && totalPages > 0"
        class="d-flex justify-content-center mt-4"
      >
        <nav aria-label="Task pagination">
          <ul class="pagination mb-0">
            <!-- Previous -->

            <li class="page-item" [class.disabled]="currentPage === 1">
              <button
                type="button"
                class="page-link"
                (click)="previousPage()"
                [disabled]="currentPage === 1"
              >
                <i class="fa-solid fa-chevron-left"></i>

              </button>
            </li>

            <!-- Page Numbers -->

            <li
              *ngFor="let page of getPages()"
              class="page-item"
              [class.active]="page === currentPage"
            >
              <button type="button" class="page-link" (click)="goToPage(page)">
                {{ page }}
              </button>
            </li>

            <!-- Next -->

            <li class="page-item" [class.disabled]="currentPage === totalPages">
              <button
                type="button"
                class="page-link"
                (click)="nextPage()"
                [disabled]="currentPage === totalPages"
              >

                <i class="fa-solid fa-chevron-right"></i>
              </button>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>
</div>

<div class="container mt-4">

  <div class="card mb-3">

    <div class="card-body">

      <!-- Heading -->
      <h4 class="mb-3">
        {{ isHomePage ? 'Recent Tasks' : 'My Tasks' }}
      </h4>


      <!-- Search & Filters -->
      <div *ngIf="!isHomePage">

        <!-- Search -->
        <input
          type="text"
          class="form-control mb-3"
          placeholder="Search Task"
          [(ngModel)]="searchText"
        />


        <!-- Filters -->
        <div class="row mb-4">

          <!-- Status -->
          <div class="col-md-6 mb-2">

            <div class="btn-group w-100">

              <button
                class="btn"
                [ngClass]="
                  filter === 'All'
                    ? 'btn-primary'
                    : 'btn-outline-primary'
                "
                (click)="filter = 'All'"
              >
                All
              </button>


              <button
                class="btn"
                [ngClass]="
                  filter === 'TODO'
                    ? 'btn-warning'
                    : 'btn-outline-warning'
                "
                (click)="filter = 'TODO'"
              >
                To Do
              </button>


              <button
                class="btn"
                [ngClass]="
                  filter === 'IN_PROGRESS'
                    ? 'btn-primary'
                    : 'btn-outline-primary'
                "
                (click)="filter = 'IN_PROGRESS'"
              >
                In Progress
              </button>


              <button
                class="btn"
                [ngClass]="
                  filter === 'COMPLETED'
                    ? 'btn-success'
                    : 'btn-outline-success'
                "
                (click)="filter = 'COMPLETED'"
              >
                Completed
              </button>

            </div>

          </div>


          <!-- Priority -->
          <div class="col-md-4 mb-2">

            <select
              class="form-select"
              [(ngModel)]="priority"
            >

              <option value="All">
                All Priorities
              </option>

              <option value="URGENT">
                Urgent
              </option>

              <option value="HIGH">
                High
              </option>

              <option value="MEDIUM">
                Medium
              </option>

              <option value="LOW">
                Low
              </option>

            </select>

          </div>

        </div>

      </div>


      <!-- ========================= -->
      <!-- Home Page -->
      <!-- ========================= -->

      <div *ngIf="isHomePage">

        <div
          *ngIf="tasks.length > 0; else noTasks"
        >

          <div
            *ngFor="
              let task of tasks | slice:0:5
            "
          >

            <app-task-item
              [task]="task"
            ></app-task-item>

          </div>

        </div>

      </div>


      <!-- ========================= -->
      <!-- My Tasks -->
      <!-- ========================= -->

      <div *ngIf="!isHomePage">

        <div
          *ngIf="
            (
              tasks
              | searchTask: searchText
              | filterTask: filter
              | priorityFilter: priority
            ).length > 0;
            else noTasks
          "
        >

          <div
            *ngFor="
              let task of tasks
                | searchTask: searchText
                | filterTask: filter
                | priorityFilter: priority
            "
          >

            <app-task-item
              [task]="task"
            ></app-task-item>

          </div>

        </div>

      </div>


      <!-- No Tasks -->
      <ng-template #noTasks>

        <div class="text-center py-2">

          <i
            class="fa-regular fa-circle-xmark fa-2x text-secondary mb-3"
          ></i>

          <h5 class="text-secondary">
            No tasks found.
          </h5>

          <p class="text-muted mb-0">
            Create one to get started!
          </p>

        </div>

      </ng-template>

    </div>

  </div>

</div>

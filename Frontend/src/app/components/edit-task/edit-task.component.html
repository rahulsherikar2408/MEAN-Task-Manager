<div class="container mt-4">

  <!-- Loading -->

  <div
    *ngIf="loading"
    class="text-center py-5"
  >

    <div
      class="spinner-border text-primary"
      role="status"
    ></div>

    <p class="text-muted mt-2">
      Loading task...
    </p>

  </div>


  <!-- Edit Form -->

  <div
    *ngIf="!loading"
  >

    <!-- Header -->

    <div class="mb-4">

      <button
        type="button"
        class="btn btn-link p-0 text-decoration-none mb-2"
        (click)="cancel()"
      >
        <i class="fa-solid fa-arrow-left me-1"></i>
        Back to Task
      </button>

      <h4 class="mb-1">
        <i class="fa-solid fa-pen-to-square me-2"></i>
        Edit Task
      </h4>

      <p class="text-muted mb-0">
        Update the details of your task.
      </p>

    </div>


    <!-- Card -->

    <div class="card edit-task-card shadow-sm">

      <div class="card-body p-4">

        <form
          #editTaskForm="ngForm"
          (ngSubmit)="updateTask()"
        >


          <!-- ======================
               Title
          ======================= -->

          <div class="mb-4">

            <label
              for="title"
              class="form-label fw-semibold"
            >
              Title
              <span class="text-danger">*</span>
            </label>

            <input
              type="text"
              id="title"
              name="title"
              class="form-control"
              [(ngModel)]="task.title"
              #title="ngModel"
              required
              minlength="3"
              maxlength="100"
              placeholder="Enter task title"
            >

            <div
              *ngIf="
                title.invalid &&
                (title.dirty || title.touched)
              "
              class="text-danger small mt-1"
            >

              <span
                *ngIf="title.errors?.['required']"
              >
                Title is required.
              </span>

              <span
                *ngIf="title.errors?.['minlength']"
              >
                Title must contain at least 3 characters.
              </span>

            </div>

            <div
              class="text-muted small text-end mt-1"
            >
              {{ task.title.length || 0 }}/100
            </div>

          </div>


          <!-- ======================
               Description
          ======================= -->

          <div class="mb-4">

            <label
              for="description"
              class="form-label fw-semibold"
            >
              Description
            </label>

            <textarea
              id="description"
              name="description"
              class="form-control"
              rows="5"
              maxlength="1000"
              [(ngModel)]="task.description"
              placeholder="Enter task description"
            ></textarea>

            <div
              class="text-muted small text-end mt-1"
            >
              {{ task.description.length || 0 }}/1000
            </div>

          </div>


          <!-- ======================
               Status
          ======================= -->

          <div class="row g-3 mb-4">


            <div class="col-md-6">

              <label
                for="status"
                class="form-label fw-semibold"
              >
                Status
              </label>

              <select
                id="status"
                name="status"
                class="form-select"
                [(ngModel)]="task.status"
              >

                <option value="TODO">
                  To Do
                </option>

                <option value="IN_PROGRESS">
                  In Progress
                </option>

                <option value="COMPLETED">
                  Completed
                </option>

              </select>

            </div>


            <!-- Priority -->

            <div class="col-md-6">

              <label
                for="priority"
                class="form-label fw-semibold"
              >
                Priority
              </label>

              <select
                id="priority"
                name="priority"
                class="form-select"
                [(ngModel)]="task.priority"
              >

                <option value="LOW">
                  Low
                </option>

                <option value="MEDIUM">
                  Medium
                </option>

                <option value="HIGH">
                  High
                </option>

                <option value="URGENT">
                  Urgent
                </option>

              </select>

            </div>

          </div>


          <!-- ======================
               Category + Due Date
          ======================= -->

          <div class="row g-3 mb-4">


            <!-- Category -->

            <div class="col-md-6">

              <label
                for="category"
                class="form-label fw-semibold"
              >
                Category
              </label>

              <select
                id="category"
                name="category"
                class="form-select"
                [(ngModel)]="task.category"
              >

                <option
                  *ngFor="
                    let category of categories
                  "
                  [value]="category"
                >
                  {{ category }}
                </option>

              </select>

            </div>


            <!-- Due Date -->

            <div class="col-md-6">

              <label
                for="dueDate"
                class="form-label fw-semibold"
              >
                Due Date
              </label>

              <input
                type="date"
                id="dueDate"
                name="dueDate"
                class="form-control"
                [(ngModel)]="task.dueDate"
              >

            </div>

          </div>


          <!-- ======================
               Tags
          ======================= -->

          <div class="mb-4">

            <label
              for="tags"
              class="form-label fw-semibold"
            >
              Tags
            </label>

            <input
              type="text"
              id="tags"
              name="tags"
              class="form-control"
              [(ngModel)]="tagsInput"
              placeholder="e.g. angular, frontend, urgent"
            >

            <div class="form-text">
              Separate multiple tags using commas.
            </div>

          </div>


          <!-- ======================
               Buttons
          ======================= -->

          <div
            class="d-flex justify-content-end gap-2 pt-3 border-top"
          >

            <button
              type="button"
              class="btn btn-outline-secondary"
              (click)="cancel()"
              [disabled]="saving"
            >
              Cancel
            </button>


            <button
              type="submit"
              class="btn btn-primary"
              [disabled]="
                saving ||
                editTaskForm.invalid
              "
            >

              <span
                *ngIf="saving"
                class="spinner-border spinner-border-sm me-2"
              ></span>

              <i
                *ngIf="!saving"
                class="fa-solid fa-floppy-disk me-1"
              ></i>

              Save Changes

            </button>

          </div>

        </form>

      </div>

    </div>

  </div>

</div>

<div
  class="task-item-card saas-card p-3"
  [class.task-item-completed]="task.status === 'COMPLETED'"
  [class.task-item-overdue]="isOverdue()"
>
  <div class="d-flex align-items-start gap-3">
    <!-- Status Toggle Checkbox Button -->
    <button
      type="button"
      class="status-toggle-btn"
      [class.checked]="task.status === 'COMPLETED'"
      (click)="toggleStatus()"
      [disabled]="toggling || deleting"
      [title]="task.status === 'COMPLETED' ? 'Mark as incomplete' : 'Mark as complete'"
      aria-label="Toggle task completion status"
    >
      <span *ngIf="toggling" class="spinner-border spinner-border-sm status-toggle-spinner"></span>
      <i *ngIf="!toggling && task.status === 'COMPLETED'" class="fa-solid fa-check"></i>
    </button>

    <!-- Task Body / Details -->
    <div class="flex-grow-1 min-w-0">
      <!-- Title & Main Actions on Desktop -->
      <div class="d-flex justify-content-between align-items-start gap-2 mb-1">
        <a
          [routerLink]="['/tasks', task._id]"
          class="task-item-title text-decoration-none"
          [class.completed-title]="task.status === 'COMPLETED'"
        >
          {{ task.title }}
        </a>

        <!-- Desktop Action Buttons -->
        <div class="task-action-btns d-none d-sm-flex align-items-center gap-1">
          <button
            type="button"
            class="action-icon-btn action-view"
            (click)="viewTask()"
            title="View Task Details"
            aria-label="View task details"
          >
            <i class="fa-regular fa-eye"></i>
          </button>

          <button
            type="button"
            class="action-icon-btn action-edit"
            (click)="editTask()"
            title="Edit Task"
            aria-label="Edit task"
          >
            <i class="fa-solid fa-pen"></i>
          </button>

          <button
            type="button"
            class="action-icon-btn action-delete"
            (click)="deleteTask()"
            [disabled]="deleting"
            title="Delete Task"
            aria-label="Delete task"
          >
            <span *ngIf="deleting" class="spinner-border spinner-border-sm text-danger"></span>
            <i *ngIf="!deleting" class="fa-regular fa-trash-can"></i>
          </button>
        </div>
      </div>

      <!-- Description Snippet -->
      <p *ngIf="task.description" class="task-item-desc mb-2">
        {{ task.description }}
      </p>

      <!-- Badges & Metadata Row -->
      <div class="d-flex flex-wrap align-items-center gap-2 pt-1">
        <!-- Status Badge -->
        <span
          class="badge-pill"
          [ngClass]="{
            'badge-status-todo': task.status === 'TODO',
            'badge-status-progress': task.status === 'IN_PROGRESS',
            'badge-status-completed': task.status === 'COMPLETED'
          }"
        >
          <span class="badge-dot"></span>
          {{
            task.status === 'TODO'
              ? 'To Do'
              : task.status === 'IN_PROGRESS'
              ? 'In Progress'
              : 'Completed'
          }}
        </span>

        <!-- Priority Badge -->
        <span
          class="badge-pill"
          [ngClass]="{
            'badge-priority-low': task.priority === 'LOW',
            'badge-priority-medium': task.priority === 'MEDIUM',
            'badge-priority-high': task.priority === 'HIGH',
            'badge-priority-urgent': task.priority === 'URGENT'
          }"
        >
          {{ task.priority }}
        </span>

        <!-- Category Badge -->
        <span class="badge-category" *ngIf="task.category">
          <i class="fa-solid fa-folder text-muted"></i>
          {{ task.category }}
        </span>

        <!-- Due Date Badge -->
        <span
          *ngIf="task.dueDate"
          class="badge-date"
          [ngClass]="{
            'overdue': isOverdue(),
            'due-today': isDueToday()
          }"
        >
          <i class="fa-regular fa-calendar"></i>
          <span *ngIf="isOverdue()">Overdue · </span>
          <span *ngIf="isDueToday()">Due Today · </span>
          {{ task.dueDate | date: 'mediumDate' }}
        </span>

        <!-- Tags -->
        <ng-container *ngIf="task.tags && task.tags.length > 0">
          <span class="badge-tag" *ngFor="let tag of task.tags">
            #{{ tag }}
          </span>
        </ng-container>

        <!-- Mobile Action Buttons (Visible only on very small screens) -->
        <div class="d-flex d-sm-none align-items-center gap-1 ms-auto pt-1">
          <button
            type="button"
            class="action-icon-btn action-view"
            (click)="viewTask()"
            aria-label="View task details"
          >
            <i class="fa-regular fa-eye"></i>
          </button>
          <button
            type="button"
            class="action-icon-btn action-edit"
            (click)="editTask()"
            aria-label="Edit task"
          >
            <i class="fa-solid fa-pen"></i>
          </button>
          <button
            type="button"
            class="action-icon-btn action-delete"
            (click)="deleteTask()"
            [disabled]="deleting"
            aria-label="Delete task"
          >
            <span *ngIf="deleting" class="spinner-border spinner-border-sm text-danger"></span>
            <i *ngIf="!deleting" class="fa-regular fa-trash-can"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
